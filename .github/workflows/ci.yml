name: Secure Cloud Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false

      - name: Check Terraform Formatting
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validate Terraform Configuration
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate

      - name: Install Checkov
        run: |
          python -m pip install checkov==3.3.30

      - name: Run Checkov Terraform Security Scan
        run: |
          checkov -d ./terraform --framework terraform

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency Security Scan
        run: |
          pip install pip-audit
          pip-audit -r application/requirements.txt

      - name: Run Flake8
        working-directory: application
        run: |
          flake8 .

      - name: Install Bandit
        run: |
          python -m pip install bandit==1.9.4

      - name: Run Bandit Security Scan
        run: |
          bandit -ll application/app.py application/config.py application/routes.py application/services.py application/utils.py

      - name: Run Pytest
        working-directory: application
        run: |
          pytest

      - name: Build Docker Image
        run: |
          docker build --pull --no-cache -t secure-cloud-platform:latest ./application

      - name: Verify Python Package Versions
        run: |
          docker run --rm secure-cloud-platform:latest python -m pip show msgpack setuptools
          docker run --rm secure-cloud-platform:latest python -m pip freeze | grep -E "msgpack|setuptools"

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: secure-cloud-platform:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Generate SBOM
        run: |
          syft secure-cloud-platform:latest \
            -o cyclonedx-json \
            > sbom.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: secure-cloud-platform-sbom
          path: sbom.json
          retention-days: 30
