name: Secure Cloud Platform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Dependency Security Scan
        run: |
          pip install pip-audit
          pip-audit -r application/requirements.txt

      - name: Run Flake8
        working-directory: application
        run: |
          flake8 .

      - name: Run Pytest
        working-directory: application
        run: |
          pytest
        
      - name: Build Docker Image
        run: |
          docker build -t secure-cloud-platform:latest ./application
        

      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-cloud-platform:latest
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate SBOM
        run: |
          syft secure-cloud-platform:latest \
            -o cyclonedx-json \
            > sbom.json

            - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secure-cloud-platform-sbom
          path: sbom.json
          retention-days: 30